# 电商智能客服 RAG 系统 - Docker Compose
# 使用方法:
#   1. 将此文件复制到 VM 的 /root/rag-system/
#   2. 执行: docker compose -f docker-compose-rag.yml up -d
#   3. 访问: http://VM_IP:8000/docs (API 文档)
#   4. 访问: http://VM_IP:7860 (知识库入库平台)
#   5. 访问: http://VM_IP:7861 (用户聊天界面)
#   6. 访问: http://VM_IP:7862 (管理员控制台)
#
# 注意: Milvus 已在另一个 docker-compose.yml 中运行

services:
  # ── Redis 缓存 ──
  redis:
    container_name: rag-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - milvus

  # ── FastAPI 应用 ──
  api:
    container_name: rag-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Shanghai
      - JWT_SECRET=${JWT_SECRET:?请设置强随机 JWT_SECRET}
      - ENABLE_DEMO_USERS=${ENABLE_DEMO_USERS:-true}  # 演示/测试用；生产请设 false
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      - MILVUS_USER=${MILVUS_USER:-root}
      - MILVUS_PASSWORD=${MILVUS_PASSWORD:?请设置 Milvus 密码}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BAILIAN_API_KEY=${BAILIAN_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY}
      - VISION_MODEL=${VISION_MODEL:-glm-4v-flash}
      # 订单/物流查询复用第二项目 copilot MySQL（VM 上 docker-mysql-1 发布 0.0.0.0:3306）
      - MYSQL_HOST=${MYSQL_HOST:?请设置 MySQL 主机地址}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:?请设置 MySQL 只读账号}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?请设置 MySQL 只读账号密码}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-copilot}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - milvus

  # ── 知识库入库平台 ──
  gradio:
    container_name: rag-gradio
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "src.admin.gradio_app"]
    ports:
      - "7860:7860"
    environment:
      - TZ=Asia/Shanghai
      - GRADIO_USERNAME=${GRADIO_USERNAME:?请设置 UI 访问用户名}
      - GRADIO_PASSWORD=${GRADIO_PASSWORD:?请设置 UI 访问密码}
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      - MILVUS_USER=${MILVUS_USER:-root}
      - MILVUS_PASSWORD=${MILVUS_PASSWORD:?请设置 Milvus 密码}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BAILIAN_API_KEY=${BAILIAN_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY}
      - VISION_MODEL=${VISION_MODEL:-glm-4v-flash}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - milvus

  # ── 用户聊天界面 ──
  chat-ui:
    container_name: rag-chat-ui
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "src.admin.chat_ui"]
    ports:
      - "7861:7861"
    environment:
      - TZ=Asia/Shanghai
      - GRADIO_USERNAME=${GRADIO_USERNAME:?请设置 UI 访问用户名}
      - GRADIO_PASSWORD=${GRADIO_PASSWORD:?请设置 UI 访问密码}
      - API_USERNAME=${API_USERNAME:?请设置 API 服务账号}
      - API_PASSWORD=${API_PASSWORD:?请设置 API 服务账号密码}
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      - MILVUS_USER=${MILVUS_USER:-root}
      - MILVUS_PASSWORD=${MILVUS_PASSWORD:?请设置 Milvus 密码}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BAILIAN_API_KEY=${BAILIAN_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY}
      - VISION_MODEL=${VISION_MODEL:-glm-4v-flash}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7861"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - milvus

  # ── 管理员控制台 ──
  admin-ui:
    container_name: rag-admin-ui
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "src.admin.admin_ui"]
    ports:
      - "7862:7862"
    environment:
      - TZ=Asia/Shanghai
      - GRADIO_USERNAME=${GRADIO_USERNAME:?请设置 UI 访问用户名}
      - GRADIO_PASSWORD=${GRADIO_PASSWORD:?请设置 UI 访问密码}
      - API_USERNAME=${API_USERNAME:?请设置 API 服务账号}
      - API_PASSWORD=${API_PASSWORD:?请设置 API 服务账号密码}
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      - MILVUS_USER=${MILVUS_USER:-root}
      - MILVUS_PASSWORD=${MILVUS_PASSWORD:?请设置 Milvus 密码}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BAILIAN_API_KEY=${BAILIAN_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY}
      - VISION_MODEL=${VISION_MODEL:-glm-4v-flash}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7862"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - milvus

volumes:
  redis_data:

networks:
  milvus:
    external: true

[project]
name = "e-commerce-customer-service-system"
version = "0.1.0"
description = "Agentic RAG 电商智能客服系统 — 意图路由 + 混合检索 + 幻觉检测自纠正 + 全栈部署"
authors = [
    {name = "Liang Minghuang"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    # ========== LLM 框架 ==========
    "langchain (>=1.2.0)",
    "langgraph (>=1.1.0)",
    "langchain-openai (>=1.1.0)",
    "langchain-community (>=0.4.0)",

    # ========== 向量数据库 ==========
    "pymilvus (>=2.4.0)",

    # ========== Web 框架 ==========
    "fastapi (>=0.115.0)",
    "uvicorn[standard] (>=0.34.0)",
    "httpx (>=0.28.0)",

    # ========== 文档解析 ==========
    "pymupdf (>=1.25.0)",
    "python-docx (>=1.1.0)",
    "openpyxl (>=3.1.0)",
    "beautifulsoup4 (>=4.12.0)",
    "lxml (>=5.3.0)",

    # ========== Embedding / 检索 ==========
    "sentence-transformers (>=3.4.0)",
    "jieba (>=0.42.1)",
    "numpy (>=2.0.0)",

    # ========== 缓存 ==========
    "redis (>=5.2.0)",

    # ========== 工具 ==========
    "pydantic (>=2.0.0)",
    "pydantic-settings (>=2.0.0)",
    "python-dotenv (>=1.0.0)",
    "structlog (>=24.0.0)",
    "pillow (>=11.0.0)",
    "tenacity (>=9.0.0)",

    # ========== 安全 ==========
    "slowapi (>=0.1.0)",

    # ========== 管理后台 ==========
    "gradio (>=5.0.0)",
    "python-pptx (>=1.0.2,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pre-commit (>=4.6.0,<5.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "ruff (>=0.15.22,<0.16.0)",
    "pytest (>=8.0.0)",
    "pytest-asyncio (>=0.25.0)",
    "pytest-cov (>=6.0.0)",
]


[tool.black]
target-version = ["py313"]

[tool.isort]
profile = "black"

[tool.ruff]
# 开发阶段放宽检查，模块完善后逐步收紧
ignore = [
    "F401",   # 未使用的导入（后续模块会用）
    "F841",   # 未使用的变量（开发中暂留）
]

[tool.ruff.lint.per-file-ignores]
# 测试文件允许未使用的导入
"tests/**/*.py" = ["F401", "F811"]

[tool.poetry]
package-mode = false
